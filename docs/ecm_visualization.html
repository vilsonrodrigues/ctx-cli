<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECM Git-Style Visualization</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #0d1117;
            --card: #161b22;
            --border: #30363d;
            --text: #c9d1d9;
            --muted: #8b949e;
            --main: #3fb950;
            --scope: #58a6ff;
            --note: #f0883e;
            --insight: #a371f7;
            --archived: #6e7681;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 2rem;
        }

        h1 {
            text-align: center;
            margin-bottom: 0.5rem;
            color: var(--scope);
        }

        .subtitle {
            text-align: center;
            color: var(--muted);
            margin-bottom: 2rem;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }

        .step-btn {
            padding: 0.5rem 1rem;
            border: 1px solid var(--border);
            background: var(--card);
            color: var(--text);
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s;
        }

        .step-btn:hover {
            border-color: var(--scope);
        }

        .step-btn.active {
            background: var(--scope);
            color: #000;
            border-color: var(--scope);
        }

        .command-box {
            max-width: 800px;
            margin: 0 auto 2rem;
            padding: 1rem;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 8px;
            font-family: 'SF Mono', Monaco, monospace;
            text-align: center;
        }

        .command-box code {
            color: var(--main);
        }

        .graph-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 2rem;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
        }

        .graph-row {
            display: flex;
            align-items: flex-start;
            min-height: 60px;
            position: relative;
        }

        .graph-lanes {
            display: flex;
            width: 120px;
            flex-shrink: 0;
            position: relative;
        }

        .lane {
            width: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        .lane-line {
            width: 3px;
            background: var(--border);
            position: absolute;
            top: 0;
            bottom: 0;
        }

        .lane-line.main {
            background: var(--main);
        }

        .lane-line.scope {
            background: var(--scope);
        }

        .lane-line.archived {
            background: var(--archived);
            opacity: 0.5;
        }

        .node {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--border);
            border: 3px solid var(--bg);
            position: relative;
            z-index: 10;
            margin-top: 20px;
        }

        .node.main {
            background: var(--main);
        }

        .node.scope {
            background: var(--scope);
        }

        .node.note {
            background: var(--note);
        }

        .node.insight {
            background: var(--insight);
        }

        .node.archived {
            background: var(--archived);
        }

        .node.active {
            box-shadow: 0 0 0 4px rgba(63, 185, 80, 0.3);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                box-shadow: 0 0 0 4px rgba(63, 185, 80, 0.3);
            }

            50% {
                box-shadow: 0 0 0 8px rgba(63, 185, 80, 0);
            }
        }

        .branch-line {
            position: absolute;
            height: 3px;
            background: var(--scope);
            top: 28px;
        }

        .branch-line.to-right {
            left: 20px;
            width: 40px;
            border-radius: 0 0 8px 0;
        }

        .branch-line.to-left {
            left: -20px;
            width: 40px;
            border-radius: 0 0 0 8px;
        }

        .merge-curve {
            position: absolute;
            width: 20px;
            height: 20px;
            border: 3px solid var(--scope);
            border-top: none;
            border-left: none;
            border-radius: 0 0 12px 0;
            top: 8px;
            left: 20px;
        }

        .commit-content {
            flex: 1;
            padding: 0.75rem 1rem;
            margin-left: 1rem;
        }

        .commit-message {
            font-size: 0.95rem;
            margin-bottom: 0.25rem;
        }

        .commit-meta {
            font-size: 0.8rem;
            color: var(--muted);
            font-family: 'SF Mono', Monaco, monospace;
        }

        .commit-badge {
            display: inline-block;
            padding: 0.15rem 0.5rem;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
            margin-right: 0.5rem;
        }

        .badge-scope {
            background: var(--scope);
            color: #000;
        }

        .badge-note {
            background: var(--note);
            color: #000;
        }

        .badge-insight {
            background: var(--insight);
            color: #000;
        }

        .badge-goto {
            background: var(--main);
            color: #000;
        }

        .badge-project {
            background: #f85149;
            color: #000;
        }

        .hidden {
            display: none;
        }

        .legend {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin-top: 2rem;
            flex-wrap: wrap;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.85rem;
            color: var(--muted);
        }

        .legend-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }

        .project-separator {
            border-top: 2px dashed var(--border);
            margin: 1rem 0;
            padding-top: 1rem;
        }

        .project-label {
            font-size: 0.75rem;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 0.5rem;
        }

        .semantic-section {
            margin-top: 2rem;
            padding-top: 1rem;
            border-top: 1px solid var(--border);
        }

        .semantic-section h3 {
            font-size: 0.85rem;
            color: var(--insight);
            margin-bottom: 1rem;
        }

        .insight-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.5rem;
            background: rgba(163, 113, 247, 0.1);
            border-radius: 6px;
            margin-bottom: 0.5rem;
        }

        .insight-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--insight);
        }
    </style>
</head>

<body>
    <h1>⚡ ECM Git Graph</h1>
    <p class="subtitle">Visualização estilo Git do Explicit Context Management</p>

    <div class="controls">
        <button class="step-btn active" data-step="1">1. Initial</button>
        <button class="step-btn" data-step="2">2. scope</button>
        <button class="step-btn" data-step="3">3. note</button>
        <button class="step-btn" data-step="4">4. insight</button>
        <button class="step-btn" data-step="5">5. goto main</button>
        <button class="step-btn" data-step="6">6. new_project()</button>
    </div>

    <div class="command-box">
        <code id="current-command">$ ctx_cli status</code>
    </div>

    <div class="graph-container">
        <div class="project-label">Project: <span id="project-name">default</span></div>

        <div id="graph-content">
            <!-- Step 1: Initial -->
            <div class="graph-row" id="row-init">
                <div class="graph-lanes">
                    <div class="lane">
                        <div class="lane-line main" style="top: 28px;"></div>
                        <div class="node main active"></div>
                    </div>
                </div>
                <div class="commit-content">
                    <div class="commit-message">Initial state</div>
                    <div class="commit-meta">main (HEAD)</div>
                </div>
            </div>
        </div>

        <div class="semantic-section hidden" id="semantic-section">
            <h3>◇ Semantic Memory (Global)</h3>
            <div id="insights-list"></div>
        </div>
    </div>

    <div class="legend">
        <div class="legend-item">
            <div class="legend-dot" style="background: var(--main);"></div>
            <span>main</span>
        </div>
        <div class="legend-item">
            <div class="legend-dot" style="background: var(--scope);"></div>
            <span>scope</span>
        </div>
        <div class="legend-item">
            <div class="legend-dot" style="background: var(--note);"></div>
            <span>note</span>
        </div>
        <div class="legend-item">
            <div class="legend-dot" style="background: var(--insight);"></div>
            <span>insight</span>
        </div>
        <div class="legend-item">
            <div class="legend-dot" style="background: var(--archived);"></div>
            <span>archived</span>
        </div>
    </div>

    <script>
        const graphContent = document.getElementById('graph-content');
        const semanticSection = document.getElementById('semantic-section');
        const insightsList = document.getElementById('insights-list');
        const projectName = document.getElementById('project-name');

        const steps = {
            1: {
                command: '$ ctx_cli status',
                render: () => {
                    projectName.textContent = 'default';
                    semanticSection.classList.add('hidden');
                    insightsList.innerHTML = '';
                    graphContent.innerHTML = `
                        <div class="graph-row">
                            <div class="graph-lanes">
                                <div class="lane">
                                    <div class="lane-line main" style="top: 28px;"></div>
                                    <div class="node main active"></div>
                                </div>
                            </div>
                            <div class="commit-content">
                                <div class="commit-message">Initial state</div>
                                <div class="commit-meta">main (HEAD)</div>
                            </div>
                        </div>
                    `;
                }
            },
            2: {
                command: '$ ctx_cli scope user-model -m "Building User model"',
                render: () => {
                    projectName.textContent = 'default';
                    semanticSection.classList.add('hidden');
                    graphContent.innerHTML = `
                        <div class="graph-row">
                            <div class="graph-lanes">
                                <div class="lane">
                                    <div class="lane-line main"></div>
                                    <div class="node main"></div>
                                </div>
                            </div>
                            <div class="commit-content">
                                <div class="commit-message">Initial state</div>
                                <div class="commit-meta">main</div>
                            </div>
                        </div>
                        <div class="graph-row">
                            <div class="graph-lanes">
                                <div class="lane">
                                    <div class="lane-line main"></div>
                                </div>
                                <div class="lane" style="position: relative;">
                                    <div class="lane-line scope" style="top: 28px;"></div>
                                    <div class="node scope active"></div>
                                    <div class="merge-curve" style="left: -20px; border-right: none; border-left: 3px solid var(--scope); border-radius: 0 0 0 12px;"></div>
                                </div>
                            </div>
                            <div class="commit-content">
                                <div class="commit-message">
                                    <span class="commit-badge badge-scope">SCOPE</span>
                                    Building User model
                                </div>
                                <div class="commit-meta">user-model (HEAD)</div>
                            </div>
                        </div>
                    `;
                }
            },
            3: {
                command: '$ ctx_cli note -m "Created User dataclass with validation"',
                render: () => {
                    projectName.textContent = 'default';
                    semanticSection.classList.add('hidden');
                    graphContent.innerHTML = `
                        <div class="graph-row">
                            <div class="graph-lanes">
                                <div class="lane">
                                    <div class="lane-line main"></div>
                                    <div class="node main"></div>
                                </div>
                            </div>
                            <div class="commit-content">
                                <div class="commit-message">Initial state</div>
                                <div class="commit-meta">main</div>
                            </div>
                        </div>
                        <div class="graph-row">
                            <div class="graph-lanes">
                                <div class="lane">
                                    <div class="lane-line main"></div>
                                </div>
                                <div class="lane" style="position: relative;">
                                    <div class="lane-line scope"></div>
                                    <div class="node scope"></div>
                                    <div class="merge-curve" style="left: -20px; border-right: none; border-left: 3px solid var(--scope); border-radius: 0 0 0 12px;"></div>
                                </div>
                            </div>
                            <div class="commit-content">
                                <div class="commit-message">
                                    <span class="commit-badge badge-scope">SCOPE</span>
                                    Building User model
                                </div>
                                <div class="commit-meta">user-model</div>
                            </div>
                        </div>
                        <div class="graph-row">
                            <div class="graph-lanes">
                                <div class="lane">
                                    <div class="lane-line main"></div>
                                </div>
                                <div class="lane">
                                    <div class="lane-line scope" style="top: 28px;"></div>
                                    <div class="node note active"></div>
                                </div>
                            </div>
                            <div class="commit-content">
                                <div class="commit-message">
                                    <span class="commit-badge badge-note">NOTE</span>
                                    Created User dataclass with validation
                                </div>
                                <div class="commit-meta">user-model (HEAD) • 1 note</div>
                            </div>
                        </div>
                    `;
                }
            },
            4: {
                command: '$ ctx_cli insight -m "Pattern: dataclass with validate_X methods"',
                render: () => {
                    projectName.textContent = 'default';
                    semanticSection.classList.remove('hidden');
                    insightsList.innerHTML = `
                        <div class="insight-item">
                            <div class="insight-dot"></div>
                            <span>Pattern: dataclass with validate_X methods</span>
                        </div>
                    `;
                    graphContent.innerHTML = `
                        <div class="graph-row">
                            <div class="graph-lanes">
                                <div class="lane">
                                    <div class="lane-line main"></div>
                                    <div class="node main"></div>
                                </div>
                            </div>
                            <div class="commit-content">
                                <div class="commit-message">Initial state</div>
                                <div class="commit-meta">main</div>
                            </div>
                        </div>
                        <div class="graph-row">
                            <div class="graph-lanes">
                                <div class="lane">
                                    <div class="lane-line main"></div>
                                </div>
                                <div class="lane" style="position: relative;">
                                    <div class="lane-line scope"></div>
                                    <div class="node scope"></div>
                                    <div class="merge-curve" style="left: -20px; border-right: none; border-left: 3px solid var(--scope); border-radius: 0 0 0 12px;"></div>
                                </div>
                            </div>
                            <div class="commit-content">
                                <div class="commit-message">
                                    <span class="commit-badge badge-scope">SCOPE</span>
                                    Building User model
                                </div>
                                <div class="commit-meta">user-model</div>
                            </div>
                        </div>
                        <div class="graph-row">
                            <div class="graph-lanes">
                                <div class="lane">
                                    <div class="lane-line main"></div>
                                </div>
                                <div class="lane">
                                    <div class="lane-line scope"></div>
                                    <div class="node note"></div>
                                </div>
                            </div>
                            <div class="commit-content">
                                <div class="commit-message">
                                    <span class="commit-badge badge-note">NOTE</span>
                                    Created User dataclass with validation
                                </div>
                                <div class="commit-meta">user-model • 1 note</div>
                            </div>
                        </div>
                        <div class="graph-row">
                            <div class="graph-lanes">
                                <div class="lane">
                                    <div class="lane-line main"></div>
                                </div>
                                <div class="lane">
                                    <div class="lane-line scope" style="top: 28px;"></div>
                                    <div class="node insight active"></div>
                                </div>
                            </div>
                            <div class="commit-content">
                                <div class="commit-message">
                                    <span class="commit-badge badge-insight">INSIGHT</span>
                                    Pattern: dataclass with validate_X methods
                                </div>
                                <div class="commit-meta">user-model (HEAD) • GLOBAL</div>
                            </div>
                        </div>
                    `;
                }
            },
            5: {
                command: '$ ctx_cli goto main -m "User model complete"',
                render: () => {
                    projectName.textContent = 'default';
                    semanticSection.classList.remove('hidden');
                    graphContent.innerHTML = `
                        <div class="graph-row">
                            <div class="graph-lanes">
                                <div class="lane">
                                    <div class="lane-line main"></div>
                                    <div class="node main"></div>
                                </div>
                            </div>
                            <div class="commit-content">
                                <div class="commit-message">Initial state</div>
                                <div class="commit-meta">main</div>
                            </div>
                        </div>
                        <div class="graph-row">
                            <div class="graph-lanes">
                                <div class="lane">
                                    <div class="lane-line main"></div>
                                </div>
                                <div class="lane" style="position: relative;">
                                    <div class="lane-line scope"></div>
                                    <div class="node scope"></div>
                                    <div class="merge-curve" style="left: -20px; border-right: none; border-left: 3px solid var(--scope); border-radius: 0 0 0 12px;"></div>
                                </div>
                            </div>
                            <div class="commit-content">
                                <div class="commit-message">
                                    <span class="commit-badge badge-scope">SCOPE</span>
                                    Building User model
                                </div>
                                <div class="commit-meta">user-model</div>
                            </div>
                        </div>
                        <div class="graph-row">
                            <div class="graph-lanes">
                                <div class="lane">
                                    <div class="lane-line main"></div>
                                </div>
                                <div class="lane">
                                    <div class="lane-line scope"></div>
                                    <div class="node note"></div>
                                </div>
                            </div>
                            <div class="commit-content">
                                <div class="commit-message">
                                    <span class="commit-badge badge-note">NOTE</span>
                                    Created User dataclass
                                </div>
                                <div class="commit-meta">user-model</div>
                            </div>
                        </div>
                        <div class="graph-row">
                            <div class="graph-lanes">
                                <div class="lane">
                                    <div class="lane-line main"></div>
                                </div>
                                <div class="lane">
                                    <div class="lane-line scope" style="bottom: 28px;"></div>
                                    <div class="node insight"></div>
                                </div>
                            </div>
                            <div class="commit-content">
                                <div class="commit-message">
                                    <span class="commit-badge badge-insight">INSIGHT</span>
                                    Pattern: dataclass with validate_X
                                </div>
                                <div class="commit-meta">user-model • GLOBAL</div>
                            </div>
                        </div>
                        <div class="graph-row">
                            <div class="graph-lanes">
                                <div class="lane" style="position: relative;">
                                    <div class="lane-line main" style="top: 28px;"></div>
                                    <div class="node main active"></div>
                                    <div class="merge-curve" style="left: 20px; top: 8px;"></div>
                                </div>
                                <div class="lane">
                                </div>
                            </div>
                            <div class="commit-content">
                                <div class="commit-message">
                                    <span class="commit-badge badge-goto">GOTO</span>
                                    User model complete
                                </div>
                                <div class="commit-meta">main (HEAD) • merged from user-model</div>
                            </div>
                        </div>
                    `;
                }
            },
            6: {
                command: '$ store.new_project("ecommerce-api")  # Developer API',
                render: () => {
                    projectName.textContent = 'ecommerce-api';
                    semanticSection.classList.remove('hidden');
                    graphContent.innerHTML = `
                        <div class="project-separator">
                            <div class="project-label" style="color: var(--archived);">Archived: default</div>
                        </div>
                        <div class="graph-row" style="opacity: 0.5;">
                            <div class="graph-lanes">
                                <div class="lane">
                                    <div class="lane-line archived"></div>
                                    <div class="node archived"></div>
                                </div>
                                <div class="lane">
                                    <div class="lane-line archived"></div>
                                    <div class="node archived"></div>
                                </div>
                            </div>
                            <div class="commit-content">
                                <div class="commit-message">main@default, user-model@default</div>
                                <div class="commit-meta">Accessible via: notes user-model@default</div>
                            </div>
                        </div>
                        
                        <div class="project-separator">
                            <div class="project-label" style="color: var(--main);">Current: ecommerce-api</div>
                        </div>
                        <div class="graph-row">
                            <div class="graph-lanes">
                                <div class="lane">
                                    <div class="lane-line main" style="top: 28px;"></div>
                                    <div class="node main active"></div>
                                </div>
                            </div>
                            <div class="commit-content">
                                <div class="commit-message">
                                    <span class="commit-badge badge-project">NEW PROJECT</span>
                                    Fresh main scope
                                </div>
                                <div class="commit-meta">main (HEAD) • 0 notes, 0 messages</div>
                            </div>
                        </div>
                    `;
                }
            }
        };

        document.querySelectorAll('.step-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.step-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');

                const step = parseInt(btn.dataset.step);
                document.getElementById('current-command').textContent = steps[step].command;
                steps[step].render();
            });
        });
    </script>
</body>

</html>
